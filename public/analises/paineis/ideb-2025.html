<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard IDEB 2025 — Poços de Caldas</title>
<style>
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:300 700;
  font-display:swap;src:url('/fonts/ibm-plex-sans-latin.woff2') format('woff2')}
@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 800;
  font-display:swap;src:url('/fonts/playfair-display-latin.woff2') format('woff2')}
:root{
  /* Paleta do site — ver src/styles/global.css */
  --plane:#F8F6F1; --surface:#FFFFFF; --ink:#1C1917; --ink-2:#57534E; --muted:#78716C;
  --grid:#E9E3DB; --axis:#CFC7BC; --border:#E2DDD6;
  --rail:#1B4F4F; --rail-ink:#F8F6F1; --rail-ink-2:#9FBAB7; --rail-hover:rgba(248,246,241,.10);
  --mun:#1B4F4F; --est:#B4531F; --pub:#6E5B9B; --aprend:#4E7C7C; --fluxo:#6E8B3D;
  --good:#3F6B45; --bad:#A6402F; --accent:#1B4F4F; --on-accent:#F8F6F1;
  --wash:rgba(27,79,79,.07);
  --shadow:none;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Playfair Display',Georgia,serif;
  --rail-on:var(--rail-ink); --rail-on-ink:var(--rail);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    /* variante escura da mesma paleta, em neutros quentes */
    --plane:#14120F; --surface:#1E1B17; --ink:#F5F2EC; --ink-2:#CFC7BC; --muted:#9A9188;
    --grid:#2E2A25; --axis:#3E3831; --border:#332E28;
    --rail:#17423C; --rail-ink:#EDF2F0; --rail-ink-2:#8CA8A4; --rail-hover:rgba(255,255,255,.08);
    --mun:#6FB0A6; --est:#DB7A45; --pub:#A395D8; --aprend:#79B0AA; --fluxo:#9CBF63;
    --good:#7DB183; --bad:#D9705C; --accent:#6FB0A6; --on-accent:#11302D;
    --wash:rgba(111,176,166,.14);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  /* variante escura da mesma paleta, em neutros quentes */
  --plane:#14120F; --surface:#1E1B17; --ink:#F5F2EC; --ink-2:#CFC7BC; --muted:#9A9188;
  --grid:#2E2A25; --axis:#3E3831; --border:#332E28;
  --rail:#17423C; --rail-ink:#EDF2F0; --rail-ink-2:#8CA8A4; --rail-hover:rgba(255,255,255,.08);
  --mun:#6FB0A6; --est:#DB7A45; --pub:#A395D8; --aprend:#79B0AA; --fluxo:#9CBF63;
  --good:#7DB183; --bad:#D9705C; --accent:#6FB0A6; --on-accent:#11302D;
  --wash:rgba(111,176,166,.14);
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
@media (max-width:860px){.app{grid-template-columns:1fr}}

/* ---------------------------------------------------------------- rail --- */
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 0 16px;display:flex;
  flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
@media (max-width:860px){.rail{position:static;height:auto}}
.rail .brand{padding:0 18px}
.rail .brand .eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rail-ink-2);font-weight:700}
.rail .brand h1{font-family:var(--font-display);font-size:18px;margin:6px 0 3px;
  font-weight:700;line-height:1.2;letter-spacing:-.01em}
.rail .brand .sub{font-size:11px;color:var(--rail-ink-2)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
  color:var(--rail-ink-2);font:600 13px var(--font-body);text-align:left;
  padding:9px 10px;border-radius:4px;cursor:pointer}
.nav button:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav button.on{background:var(--rail-on);color:var(--rail-on-ink)}
.nav .num{font-size:10.5px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums;
  min-width:14px}
.rail .foot{margin-top:auto;padding:0 18px;font-size:10.5px;color:var(--rail-ink-2);line-height:1.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* --------------------------------------------------------------- stage --- */
.stage{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 24px;
  border-bottom:1px solid var(--border);background:var(--plane)}
.topbar h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;
  letter-spacing:-.01em;flex:1;min-width:160px}
.topbar .hint{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:3px;background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:3px}
.seg button{border:0;background:none;color:var(--ink-2);font:600 12px var(--font-body);
  padding:5px 11px;border-radius:3px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.switch{display:inline-flex;align-items:center;gap:8px;font:600 12px var(--font-body);
  color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{width:34px;height:19px;border-radius:99px;flex:none;position:relative;
  background:color-mix(in srgb,var(--muted) 42%,transparent);transition:background .15s}
.switch .track i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(28,25,23,.28);transition:transform .15s}
.switch input:checked + .track{background:var(--est)}
.switch input:checked + .track i{transform:translateX(15px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;
  color:var(--mun);background:var(--wash);white-space:nowrap}
@media (prefers-reduced-motion: reduce){.switch .track,.switch .track i{transition:none}}
.pages{padding:20px 24px 44px;display:flex;flex-direction:column;gap:18px}
.page{display:none;flex-direction:column;gap:18px}
.page.on{display:flex}
.slicers{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.slicers .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700}

/* --------------------------------------------------------------- cards --- */
.grid{display:grid;gap:14px;align-items:start}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:1080px){.g3,.g2,.g4{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;
  box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card > h3{font-size:12.5px;margin:0;font-weight:700;color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.card > h3 .aside{font-size:11px;font-weight:600;color:var(--muted)}

/* KPI */
.kpi .top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.kpi .val{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.01em}
.kpi .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.up{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.pill.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.pill.flat{color:var(--muted);background:color-mix(in srgb,var(--muted) 15%,transparent)}
.kpi .meta{font-size:11.5px;color:var(--ink-2)}
.meter{height:6px;border-radius:99px;background:color-mix(in srgb,var(--muted) 22%,transparent);
  overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .n{font-size:26px;font-weight:700;line-height:1.15}
.stat .d{font-size:11.5px;color:var(--ink-2)}

svg{display:block;width:100%;height:auto}
svg text{font-family:var(--font-body)}
.tick{fill:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.gline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--axis);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-2)}
.legend .it{display:flex;align-items:center;gap:5px}
.sw{width:11px;height:11px;border-radius:3px}
.sw.line{height:3px;width:15px;border-radius:2px}
.sw.dash{height:0;width:15px;border-top:2px dashed var(--muted);background:none;border-radius:0}

.tbl-wrap{overflow-x:auto;max-height:430px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{position:sticky;top:0;background:var(--surface);font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2);text-align:left;padding:7px 9px;
  border-bottom:1px solid var(--axis);white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
td.name{white-space:normal;min-width:170px}
td.num,th.num{text-align:right}
tr.me td{font-weight:700;background:var(--wash)}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}.zero{color:var(--muted)}

/* ranking */
.rk{display:flex;flex-direction:column;gap:7px}
.rk .row{display:grid;grid-template-columns:20px 1fr 92px 42px;align-items:center;gap:9px;
  font-size:12.5px}
.rk .ord{font-size:11px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;
  text-align:right}
.rk .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .bar{height:13px;border-radius:3px;position:relative;background:color-mix(in srgb,var(--muted) 14%,transparent)}
.rk .bar i{display:block;height:100%;border-radius:3px}
.rk .vl{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}

/* fichas */
.fichas{display:grid;grid-template-columns:296px 1fr;gap:14px;align-items:start}
@media (max-width:1080px){.fichas{grid-template-columns:1fr}}
.lista{padding:6px;max-height:74vh;overflow-y:auto}
.lista button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;
  text-align:left;padding:8px 10px;border-radius:4px;cursor:pointer;color:var(--ink);
  font:13px/1.35 var(--font-body)}
.lista button:hover{background:var(--wash)}
.lista button.on{background:var(--wash);box-shadow:inset 2px 0 0 var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.lnome{flex:1}
.lideb{font-weight:700;font-variant-numeric:tabular-nums}
.chip{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 7px;
  border-radius:99px;flex:none}
.chip.neg{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chip.pos{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.chip.na{color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent)}
#busca{background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:7px 11px;font:13px var(--font-body);color:var(--ink);width:100%}
.ficha{padding:18px 20px;display:flex;flex-direction:column;gap:20px}
.f-head .eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-2);font-weight:700}
.f-head h4{font-family:var(--font-display);margin:4px 0 0;font-size:21px;font-weight:700;
  letter-spacing:-.01em}
.kpis3{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.kbox{border:1px solid var(--border);border-radius:4px;padding:9px 11px}
.kbox .l{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.kbox .v{font-size:25px;font-weight:700;line-height:1.2}
.metaref{font-size:11.5px;color:var(--muted)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1240px){.duo{grid-template-columns:1fr}}
.obs{margin:0;padding-left:17px}
.obs li{margin-bottom:5px}
.rodape{font-size:11px;color:var(--muted)}
h5{font-size:12.5px;margin:0 0 7px;font-weight:700}

#tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);
  border-radius:4px;padding:7px 10px;font-size:12px;box-shadow:0 6px 20px rgba(28,25,23,.12);
  opacity:0;transition:opacity .1s;z-index:20;max-width:250px}
#tip.on{opacity:1}
#tip .t{font-weight:700;margin-bottom:2px}
#tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){#tip{transition:none}}
</style>
<script>
  /* Tema claro por padrao, como o resto do site; 'auto' segue o sistema. */
  try{ document.documentElement.dataset.theme =

  catch(err){ document.documentElement.dataset.theme = 'light'; }
</script>

</div>

/* ====================================================== utilidades comuns === */
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = 'http://www.w3.org/2000/svg';
const REDE_VAR = {Municipal:'--mun', Estadual:'--est', 'Pública':'--pub'};
const corRede = r => css(REDE_VAR[r] || '--pub');
const ETAPAS = ['AI','AF','EM'];
const fmt  = (v,c=1) => v==null ? '—' : v.toFixed(c).replace('.',',');
const fmtS = (v,c=2) => v==null ? '—' : (v>0?'+':v<0?'':'') + (Math.abs(v)<5e-3?0:v).toFixed(c).replace('.',',');
const cls  = v => v==null ? 'zero' : v>0 ? 'pos' : v<0 ? 'neg' : 'zero';

/* --- filtro global de rede --------------------------------------------------
   Desligado, o dashboard passa a analisar SÓ a rede municipal: some a rede
   estadual e também a "Pública" (que é a soma das duas, portanto contaminada). */
let incluirEstadual = true;
const redesAtivas   = () => incluirEstadual ? ['Municipal','Estadual','Pública'] : ['Municipal'];
const redePrincipal = () => incluirEstadual ? 'Pública' : 'Municipal';
const corPrincipal  = () => corRede(redePrincipal());
const soMunicipal   = arr => arr.filter(r => incluirEstadual || (r.rede || r.REDE) === 'Municipal');
/* posição da escola recalculada dentro do recorte ativo */
function posicaoEscola(etapa, id){
  const lista = soMunicipal(DATA.ranking.filter(r => r.etapa===etapa));
  const i = lista.findIndex(r => r.id===id);
  return i < 0 ? null : {pos: i+1, n: lista.length};
}

const tip = $('tip');
function showTip(html, ev){
  tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect(), p = 12;
  let x = ev.clientX + p, y = ev.clientY + p;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - p;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - p;
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
const hideTip = () => tip.classList.remove('on');
function el(n, a, p){ const e = document.createElementNS(NS,n);
  for (const k in a) e.setAttribute(k,a[k]); if (p) p.appendChild(e); return e; }
function card(titulo, aside){
  const d = document.createElement('div'); d.className = 'card';
  if (titulo) d.innerHTML = `<h3>${titulo}${aside?`<span class="aside">${aside}</span>`:''}</h3>`;
  return d;
}
function segmentado(opcoes, atual, aoTrocar){
  const s = document.createElement('div'); s.className = 'seg';
  for (const [val, rot] of opcoes){
    const b = document.createElement('button');
    b.textContent = rot; b.className = val === atual ? 'on' : '';
    b.onclick = () => aoTrocar(val);
    s.appendChild(b);
  }
  return s;
}
/* eixo y de grade + rótulos; devolve escala */
function eixoY(svg, ymin, ymax, L, R, T, H, B, passo){
  const y = v => T + (ymax - v)/(ymax - ymin)*(H - T - B);
  for (let g = Math.ceil(ymin/passo)*passo; g <= ymax + 1e-9; g += passo){
    el('line',{x1:L,x2:R,y1:y(g),y2:y(g),class:'gline'},svg);
    el('text',{x:L-5,y:y(g)+3.5,'text-anchor':'end',class:'tick'},svg)
      .textContent = Number.isInteger(g) ? g : fmt(g);
  }
  return y;
}

/* ========================================================= página 1 · KPIs === */
function pagina0(){
  const p = $('pg0'); p.innerHTML = '';
  const kp = k => DATA.kpis.find(x => x.etapa===k[0] && x.rede===k[1]);

  /* --- tiles principais: uma etapa por card, na rede em foco --- */
  const rede = redePrincipal(), cor = corPrincipal();
  const g = document.createElement('div'); g.className = 'grid g3';
  for (const et of ETAPAS){
    const k = kp([et,rede]); if (!k) continue;
    const c = card(); c.classList.add('kpi');
    const dcls = k.delta > 0 ? 'up' : k.delta < 0 ? 'down' : 'flat';
    const pill = k.delta == null ? '<span class="pill flat">sem edição 2023</span>'
                                 : `<span class="pill ${dcls}">${fmtS(k.delta,1)} vs 2023</span>`;
    c.innerHTML = `<div class="lbl">${DATA.etapa_label[et]} · rede ${rede.toLowerCase()}</div>
      <div class="top"><span class="val" style="color:${cor}">${fmt(k.ideb)}</span>${pill}</div>`;
    c.appendChild(sparkline(k.spark, cor));
    const pos = k.pct_mg;
    const barra = document.createElement('div');
    barra.innerHTML = `<div class="meter"><i style="width:${pos||0}%;background:${
        pos>=50?css('--good'):css('--bad')}"></i></div>
      <div class="meta" style="margin-top:5px">Percentil ${fmt(pos,0)} em MG · mediana MG ${fmt(k.med_mg)} · Sul de Minas ${fmt(k.med_sm)}</div>`;
    c.appendChild(barra);
    g.appendChild(c);
  }
  p.appendChild(g);

  /* --- contexto da rede --- */
  const g2 = document.createElement('div'); g2.className = 'grid g4';
  const avaliadas = soMunicipal(DATA.ranking);
  const ausentes  = soMunicipal(DATA.sem_ideb);
  const kAI = kp(['AI',rede]), kAF = kp(['AF',rede]);
  const stats = [
    ['Avaliações de escola em 2025', avaliadas.length,
     `${new Set(avaliadas.map(r=>r.id)).size} escolas com IDEB divulgado`],
    ['Escolas sem IDEB 2025', new Set(ausentes.map(r=>r.id)).size,
     'com histórico desde 2017 — verificar participação no SAEB'],
    [`Aprovação · anos iniciais`, `${fmt(kAI?.aprov)}%`,
     `rede ${rede.toLowerCase()} · nota SAEB ${fmt(kAI?.nota_n,2)}`],
    [`Aprovação · anos finais`, `${fmt(kAF?.aprov)}%`,
     `rede ${rede.toLowerCase()} · nota SAEB ${fmt(kAF?.nota_n,2)}`],
  ];
  for (const [l,n,d] of stats){
    const c = card();
    c.innerHTML = `<div class="stat"><div class="lbl" style="font-size:10.5px;letter-spacing:.1em;
      text-transform:uppercase;font-weight:700;color:var(--ink-2)">${l}</div>
      <div class="n">${n}</div><div class="d">${d}</div></div>`;
    g2.appendChild(c);
  }
  p.appendChild(g2);

  /* --- benchmark + decomposição --- */
  const g3 = document.createElement('div'); g3.className = 'grid g2';

  const cb = card('Poços × Minas Gerais × Brasil — 2025', `rede ${rede.toLowerCase()}`);
  cb.appendChild(benchChart());
  cb.insertAdjacentHTML('beforeend',
    `<div class="legend"><span class="it"><span class="sw" style="background:${cor};border-radius:50%"></span>Poços de Caldas</span>
     <span class="it"><span style="color:var(--ink)">◆</span>Mediana Sul de Minas</span>
     <span class="it"><span style="color:var(--muted)">▲</span>Mediana MG</span>
     <span class="it"><span style="color:var(--muted)">○</span>Mediana Brasil</span></div>`);
  g3.appendChild(cb);

  const cd = card('O que moveu o IDEB em 2023 → 2025', 'decomposição N × P');
  const ordEtapa = {AI:0, AF:1, EM:2}, ordRede = {Municipal:0, Estadual:1};
  const linhasDec = DATA.decomp
    .filter(d => d.ano===2025 && d.rede!=='Pública' && redesAtivas().includes(d.rede))
    .sort((a,b) => (ordEtapa[a.etapa]-ordEtapa[b.etapa]) || (ordRede[a.rede]-ordRede[b.rede]));

function sparkline(pts, cor){
  const W=260,H=44,P=3;
  const vs = pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs);
  const x = i => P + i/(pts.length-1)*(W-2*P);
  const y = v => P + (mx-v)/Math.max(.1,mx-mn)*(H-2*P);
  const svg = el('svg',{viewBox:`0 0 ${W} ${H}`,style:'max-height:44px'});
  el('path',{d:pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.v)).join(''),fill:'none',
             stroke:cor,'stroke-width':2,'stroke-linejoin':'round'},svg);
  const u = pts.length-1;
  el('circle',{cx:x(u),cy:y(pts[u].v),r:3,fill:cor,stroke:css('--surface'),'stroke-width':1.5},svg);
  pts.forEach((p,i)=>{
    const hit = el('rect',{x:x(i)-(W/pts.length)/2,y:0,width:W/pts.length,height:H,fill:'transparent'},svg);
    hit.addEventListener('mousemove',ev=>showTip(
      `<div class="t">${p.ano}</div><div class="r"><span>IDEB</span><b>${fmt(p.v)}</b></div>`,ev));
    hit.addEventListener('mouseleave',hideTip);
  });
  return svg;
}

function benchChart(){
  const W=520,rowH=54,T=10,B=26,L=96,R=22,H=T+ETAPAS.length*rowH+B;
  const ks = ETAPAS.map(e => DATA.kpis.find(k => k.etapa===e && k.rede===redePrincipal())).filter(Boolean);
  const all = ks.flatMap(k=>[k.ideb,k.med_mg,k.med_br,k.med_sm]).filter(v=>v!=null);
  const xmin=Math.floor(Math.min(...all)*2)/2-.2, xmax=Math.ceil(Math.max(...all)*2)/2+.2;
  const x = v => L+(v-xmin)/(xmax-xmin)*(W-L-R);
  const svg = el('svg',{viewBox:`0 0 ${W} ${H}`});
  for (let g=Math.ceil(xmin*2)/2; g<=xmax; g+=.5){
    el('line',{x1:x(g),x2:x(g),y1:T,y2:H-B,class:'gline'},svg);
    el('text',{x:x(g),y:H-B+15,'text-anchor':'middle',class:'tick'},svg).textContent=fmt(g);
  }
  ks.forEach((k,i)=>{
    const cy = T+i*rowH+rowH/2;
    el('text',{x:0,y:cy+3.5,class:'tick',style:'font-size:11.5px;fill:'+css('--ink')+';font-weight:700'},
       svg).textContent = DATA.etapa_label[k.etapa];
    el('line',{x1:L,x2:W-R,y1:cy,y2:cy,class:'gline'},svg);
    const marcas = [['Mediana Brasil',k.med_br,'o'],['Mediana MG',k.med_mg,'t'],
                    ['Mediana Sul de Minas',k.med_sm,'d'],['Poços de Caldas',k.ideb,'p']];
    for (const [nome,v,tipo] of marcas){
      if (v==null) continue;
      const cx = x(v);
      if (tipo==='p') el('circle',{cx,cy,r:7,fill:corPrincipal(),stroke:css('--surface'),'stroke-width':2},svg);
      else if (tipo==='o') el('circle',{cx,cy,r:5,fill:css('--surface'),stroke:css('--muted'),'stroke-width':2},svg);
      else if (tipo==='t') el('path',{d:`M${cx} ${cy-6}L${cx+5.5} ${cy+4.5}L${cx-5.5} ${cy+4.5}Z`,
        fill:css('--muted'),stroke:css('--surface'),'stroke-width':1.5},svg);
      else el('path',{d:`M${cx} ${cy-6.5}L${cx+6.5} ${cy}L${cx} ${cy+6.5}L${cx-6.5} ${cy}Z`,
        fill:css('--ink'),stroke:css('--surface'),'stroke-width':1.5},svg);
      const hit = el('circle',{cx,cy,r:13,fill:'transparent'},svg);
      hit.addEventListener('mousemove',ev=>showTip(
        `<div class="t">${DATA.etapa_label[k.etapa]}</div>
         <div class="r"><span>${nome}</span><b>${fmt(v)}</b></div>`,ev));
      hit.addEventListener('mouseleave',hideTip);
    }
    el('text',{x:x(k.ideb),y:cy-13,'text-anchor':'middle',class:'tick',
      style:'font-weight:700;fill:'+css('--ink')},svg).textContent=fmt(k.ideb);
  });
  return svg;
}

/* barras de decomposição; rotulo = etapa+rede (geral) ou período (detalhe) */
function decompChart(linhas, comEtapa){
  const W=520,rowH=54,T=10,B=26,L=comEtapa?116:74,R=52,H=T+linhas.length*rowH+B;
  const ext=Math.max(.3,...linhas.flatMap(r=>[Math.abs(r.ca),Math.abs(r.cf)]))*1.25;
  const x=v=>L+(v+ext)/(2*ext)*(W-L-R);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`});
  for (const g of [-.5,-.25,.25,.5]) if (Math.abs(g)<ext){
    el('line',{x1:x(g),x2:x(g),y1:T,y2:H-B,class:'gline'},svg);
    el('text',{x:x(g),y:H-B+15,'text-anchor':'middle',class:'tick'},svg).textContent=fmtS(g,2);
  }
  el('line',{x1:x(0),x2:x(0),y1:T,y2:H-B,class:'axisline'},svg);
  el('text',{x:x(0),y:H-B+15,'text-anchor':'middle',class:'tick'},svg).textContent='0';
  linhas.forEach((r,i)=>{
    const y0=T+i*rowH, bh=14;
    if (comEtapa){
      el('text',{x:0,y:y0+rowH/2-2,class:'tick',
        style:'font-size:11.5px;fill:'+css('--ink')+';font-weight:700'},svg)
        .textContent = DATA.etapa_label[r.etapa];
      el('text',{x:0,y:y0+rowH/2+12,class:'tick',style:'font-size:10.5px'},svg)
        .textContent = 'Rede ' + r.rede.toLowerCase();
    } else {
      el('text',{x:0,y:y0+rowH/2+3.5,class:'tick',
        style:'font-size:11px;fill:'+css('--ink')+';font-weight:700'},svg).textContent = r.per;
    }
    for (const [v,cv,nome,by] of [[r.ca,'--aprend','Aprendizagem (nota SAEB)',y0+rowH/2-bh-1],
                                  [r.cf,'--fluxo','Fluxo (aprovação)',y0+rowH/2+1]]){
      const bar=el('rect',{x:Math.min(x(0),x(v)),y:by,width:Math.max(Math.abs(x(v)-x(0)),1.5),
                           height:bh,fill:css(cv),rx:2},svg);
      el('text',{x:v>=0?x(v)+4:x(v)-4,y:by+bh-3,'text-anchor':v>=0?'start':'end',class:'tick',
        style:'font-weight:700;fill:'+css('--ink')},svg).textContent=fmtS(v);
      bar.addEventListener('mousemove',ev=>showTip(
        `<div class="t">${comEtapa?DATA.etapa_label[r.etapa]+' · rede '+r.rede.toLowerCase():r.per}</div>
         <div class="r"><span>${nome}</span><b>${fmtS(v)}</b></div>
         <div class="r"><span>Δ IDEB</span><b>${fmtS(r.d)}</b></div>`,ev));
      bar.addEventListener('mouseleave',hideTip);
    }
    el('text',{x:W-6,y:y0+rowH/2+4,'text-anchor':'end',class:'tick',
      style:'font-size:12px;font-weight:700;fill:'+(r.d>0?css('--good'):r.d<0?css('--bad'):css('--muted'))},
      svg).textContent=fmtS(r.d,1);
  });
  return svg;
}

function serieChart(){
  const rows = DATA.serie.filter(s => s.etapa===etapaEvo && redesAtivas().includes(s.rede));
  const anos = [...new Set(rows.map(r=>r.ano))].sort();
  const vals = rows.flatMap(r=>[r.ideb,r.meta]).filter(v=>v!=null);
  const ymin=Math.floor(Math.min(...vals)*2)/2-.2, ymax=Math.ceil(Math.max(...vals)*2)/2+.2;
  const W=520,H=260,L=32,R=16,T=12,B=26;
  const x=a=>L+(a-anos[0])/Math.max(1,anos.at(-1)-anos[0])*(W-L-R);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`});
  const y=eixoY(svg,ymin,ymax,L,W-R,T,H,B,1);
  el('line',{x1:L,x2:W-R,y1:H-B,y2:H-B,class:'axisline'},svg);
  for (const a of anos) if (etapaEvo==='EM' || a%4===1 || a===anos[0])
    el('text',{x:x(a),y:H-B+15,'text-anchor':'middle',class:'tick'},svg).textContent=a;
  const metas = rows.filter(r=>r.rede===redePrincipal()&&r.meta!=null).sort((p,q)=>p.ano-q.ano);
  if (metas.length) el('path',{d:metas.map((r,i)=>(i?'L':'M')+x(r.ano)+' '+y(r.meta)).join(''),
    fill:'none',stroke:css('--muted'),'stroke-width':1.5,'stroke-dasharray':'5 4'},svg);
  for (const rede of redesAtivas().slice().reverse()){
    const s = rows.filter(r=>r.rede===rede&&r.ideb!=null).sort((p,q)=>p.ano-q.ano);
    if (!s.length) continue;
    const c = corRede(rede);
    el('path',{d:s.map((r,i)=>(i?'L':'M')+x(r.ano)+' '+y(r.ideb)).join(''),fill:'none',
      stroke:c,'stroke-width':2.2,'stroke-linejoin':'round'},svg);
    const u=s.at(-1);
    el('circle',{cx:x(u.ano),cy:y(u.ideb),r:3.5,fill:c,stroke:css('--surface'),'stroke-width':1.5},svg);
    el('text',{x:x(u.ano)+1,y:y(u.ideb)-8,'text-anchor':'end',class:'tick',
      style:'font-weight:700;fill:'+css('--ink')},svg).textContent=fmt(u.ideb);
  }
  anos.forEach((a,i)=>{
    const x0=i?(x(anos[i-1])+x(a))/2:L, x1=i<anos.length-1?(x(a)+x(anos[i+1]))/2:W-R;
    const hit=el('rect',{x:x0,y:T,width:x1-x0,height:H-T-B,fill:'transparent'},svg);
    hit.addEventListener('mousemove',ev=>{
      let h=`<div class="t">${DATA.etapa_label[etapaEvo]} · ${a}</div>`;
      for (const rede of redesAtivas()){
        const r=rows.find(s=>s.rede===rede&&s.ano===a);
        if (r&&r.ideb!=null) h+=`<div class="r"><span>${rede}</span><b>${fmt(r.ideb)}</b></div>`;
      }
      const m=rows.find(s=>s.rede===redePrincipal()&&s.ano===a);
      if (m&&m.meta!=null) h+=`<div class="r"><span>Meta (${redePrincipal().toLowerCase()})</span><b>${fmt(m.meta)}</b></div>`;
      showTip(h,ev);
    });
    hit.addEventListener('mouseleave',hideTip);
  });
  return svg;
}

function rankCard(titulo, itens, ordInicial, todos, menores){
  const c=card(titulo, menores?'atenção prioritária':'referências da rede');
  const max=Math.max(...todos.map(r=>r.ideb));
  const box=document.createElement('div'); box.className='rk';
  itens.forEach((r,i)=>{
    const row=document.createElement('div'); row.className='row';
    const dcls=r.d23>0?'pos':r.d23<0?'neg':'zero';
    row.innerHTML=`<span class="ord">${ordInicial+i}</span>
      <span class="nm" title="${r.nome}">${r.nome}</span>
      <span class="bar"><i style="width:${100*r.ideb/max}%;background:${corRede(r.rede)}"></i></span>
      <span class="vl">${fmt(r.ideb)}</span>`;
    row.querySelector('.bar').addEventListener('mousemove',ev=>showTip(
      `<div class="t">${r.nome}</div><div class="r"><span>Rede</span><b>${r.rede}</b></div>
       <div class="r"><span>IDEB 2025</span><b>${fmt(r.ideb)}</b></div>
       <div class="r"><span>Δ vs 2023</span><b>${fmtS(r.d23,1)}</b></div>`,ev));
    row.querySelector('.bar').addEventListener('mouseleave',hideTip);
    box.appendChild(row);
  });
  c.appendChild(box);
  c.insertAdjacentHTML('beforeend',
    `<div class="legend">${redesAtivas().filter(r=>r!=='Pública').map(r =>
      `<span class="it"><span class="sw" style="background:${corRede(r)}"></span>${r}</span>`).join('')}</div>`);
  return c;
}

  sl.appendChild(segmentado(ETAPAS.map(e=>[e,`${DATA.etapa_label[e]} · ${escolasFi(e).length}`]),

  const busca=document.createElement('input');
  busca.type='search'; busca.id='busca'; busca.placeholder='Buscar escola…';
  busca.setAttribute('aria-label','Buscar escola');
  busca.style.maxWidth='260px';
  busca.addEventListener('input',()=>renderListaFi(busca.value));
  sl.appendChild(busca);
  p.appendChild(sl);

  const wrap=document.createElement('div'); wrap.className='fichas';
  const nav=document.createElement('nav'); nav.className='card lista'; nav.id='listaFi';
  nav.setAttribute('aria-label','Escolas');
  const ficha=document.createElement('div'); ficha.className='card ficha'; ficha.id='fichaFi';
  wrap.append(nav,ficha); p.appendChild(wrap);
  if (!escolaFi || !escolasFi(etapaFi).some(e=>e.id===escolaFi))
    escolaFi = escolasFi(etapaFi)[0]?.id;
  renderListaFi(''); renderFicha();
}
function renderListaFi(filtro){
  const nav=$('listaFi'); if(!nav) return;
  nav.innerHTML='';
  const f=(filtro||'').trim().toLowerCase();
  for (const e of escolasFi(etapaFi)){
    if (f && !e.nome.toLowerCase().includes(f)) continue;
    const b=document.createElement('button');
    b.className = e.id===escolaFi?'on':'';
    const chip = e.i25==null?['na','s/ IDEB']:e.delta==null?['na','—']:
                 e.delta<0?['neg',fmtS(e.delta,1)]:e.delta>0?['pos',fmtS(e.delta,1)]:['na','0,0'];
    b.title = e.i25==null?'Sem IDEB 2025':'Variação vs 2023';
    b.innerHTML=`<span class="dot" style="background:${corRede(e.rede)}"></span>
      <span class="lnome">${e.nome}</span><span class="lideb">${fmt(e.i25)}</span>
      <span class="chip ${chip[0]}">${chip[1]}</span>`;
    b.onclick=()=>{escolaFi=e.id; renderListaFi(filtro); renderFicha();};
    nav.appendChild(b);
  }
}
function renderFicha(){
  const e=escolasFi(etapaFi).find(x=>x.id===escolaFi);
  const f=$('fichaFi'); if(!f) return;
  f.innerHTML=''; if(!e) return;
  const cor=corRede(e.rede);
  const head=document.createElement('div'); head.className='f-head';
  head.innerHTML=`<div class="eyebrow">${DATA.etapa_label[etapaFi]} · rede ${e.rede.toLowerCase()}</div>
    <h4>${e.nome}</h4>`;
  f.appendChild(head);
  const kb=document.createElement('div'); kb.className='kpis3';
  const box=(l,v,c)=>`<div class="kbox"><div class="l">${l}</div>
    <div class="v" style="color:${c||'var(--ink)'}">${v}</div></div>`;
  kb.innerHTML = box('IDEB 2025',fmt(e.i25),cor) +
    box('vs 2023',fmtS(e.delta,1), e.delta>0?'var(--good)':e.delta<0?'var(--bad)':'var(--muted)') +
    box('Posição na etapa', (()=>{ const r=posicaoEscola(etapaFi,e.id);
      return r?`${r.pos}/${r.n}`:'—'; })());
  f.appendChild(kb);
  const mr=document.createElement('div'); mr.className='metaref';
  mr.textContent = e.meta21==null
    ? 'Referência histórica: o INEP não projetou meta para esta escola (metas encerradas em 2021).'
    : `Referência histórica: meta final (2021) ${fmt(e.meta21)} · gap ${fmtS(e.gap,1)} — o INEP não projeta metas desde 2021.`;
  f.appendChild(mr);

  f.appendChild(fSerie(e,cor));
  const d1=document.createElement('div'); d1.className='duo';
  d1.append(fDecomp(e), fDisc(e)); f.appendChild(d1);
  const d2=document.createElement('div'); d2.className='duo';
  d2.append(fApr(e,cor), fObs(e)); f.appendChild(d2);
  const rod=document.createElement('div'); rod.className='rodape';
  rod.textContent='Fonte: INEP, IDEB 2025 · decomposição exata: ΔIDEB = P̄·ΔN + N̄·ΔP.';
  f.appendChild(rod);
}
function sub(t){ const d=document.createElement('div'); d.innerHTML=`<h5>${t}</h5>`; return d; }

function fSerie(e,cor){
  const b=sub('Série histórica do IDEB');
  const med=DATA.mediana_rede[etapaFi]||{};
  const anosMed=Object.keys(med).map(Number);
  const pts=e.serie;
  const vals=pts.flatMap(p=>[p.ideb,p.meta]).concat(Object.values(med)).filter(v=>v!=null);
  const ymin=Math.floor(Math.min(...vals)*2)/2-.2, ymax=Math.ceil(Math.max(...vals)*2)/2+.2;
  const anos=pts.map(p=>p.ano).concat(anosMed);
  const a0=Math.min(...anos), a1=Math.max(...anos);
  const W=860,H=230,L=34,R=16,T=12,B=26;
  const x=a=>L+(a-a0)/Math.max(1,a1-a0)*(W-L-R);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`},b);
  const y=eixoY(svg,ymin,ymax,L,W-R,T,H,B,1);
  el('line',{x1:L,x2:W-R,y1:H-B,y2:H-B,class:'axisline'},svg);
  for (let a=a0;a<=a1;a+=(a1-a0>12?4:2))
    el('text',{x:x(a),y:H-B+14,'text-anchor':'middle',class:'tick'},svg).textContent=a;
  const linha=(arr,gx,gy)=>arr.map((p,i)=>(i?'L':'M')+gx(p)+' '+gy(p)).join('');
  const medPts=anosMed.sort((p,q)=>p-q).filter(a=>med[a]!=null).map(a=>({ano:a,v:med[a]}));
  if (medPts.length && etapaFi!=='EM')
    el('path',{d:linha(medPts,p=>x(p.ano),p=>y(p.v)),fill:'none',stroke:css('--muted'),'stroke-width':1.6},svg);
  const metas=pts.filter(p=>p.meta!=null);
  if (metas.length) el('path',{d:linha(metas,p=>x(p.ano),p=>y(p.meta)),fill:'none',
    stroke:css('--axis'),'stroke-width':1.5,'stroke-dasharray':'5 4'},svg);
  const ideb=pts.filter(p=>p.ideb!=null);
  el('path',{d:linha(ideb,p=>x(p.ano),p=>y(p.ideb)),fill:'none',stroke:cor,'stroke-width':2.2,
    'stroke-linejoin':'round'},svg);
  ideb.forEach(p=>el('circle',{cx:x(p.ano),cy:y(p.ideb),r:3.5,fill:cor,stroke:css('--surface'),
    'stroke-width':1.5},svg));
  for (const p of [ideb[0],ideb.at(-1)]) if (p)
    el('text',{x:x(p.ano),y:y(p.ideb)-9,'text-anchor':'middle',class:'tick',
      style:'font-weight:700;fill:'+css('--ink')},svg).textContent=fmt(p.ideb);
  const todos=[...new Set(pts.map(p=>p.ano).concat(medPts.map(p=>p.ano)))].sort((p,q)=>p-q);
  todos.forEach((a,i)=>{
    const x0=i?(x(todos[i-1])+x(a))/2:L, x1=i<todos.length-1?(x(a)+x(todos[i+1]))/2:W-R;
    const hit=el('rect',{x:x0,y:T,width:x1-x0,height:H-T-B,fill:'transparent'},svg);
    hit.addEventListener('mousemove',ev=>{
      const p=pts.find(q=>q.ano===a);
      let h=`<div class="t">${a}</div>`;
      if (p&&p.ideb!=null) h+=`<div class="r"><span>IDEB da escola</span><b>${fmt(p.ideb)}</b></div>`;
      if (med[a]!=null&&etapaFi!=='EM') h+=`<div class="r"><span>Mediana rede municipal</span><b>${fmt(med[a])}</b></div>`;
      if (p&&p.meta!=null) h+=`<div class="r"><span>Meta da escola</span><b>${fmt(p.meta)}</b></div>`;
      showTip(h,ev);
    });
    hit.addEventListener('mouseleave',hideTip);
  });
  b.insertAdjacentHTML('beforeend',
    `<div class="legend"><span class="it"><span class="sw line" style="background:${cor}"></span>IDEB da escola</span>`+
    (etapaFi!=='EM'?`<span class="it"><span class="sw line" style="background:var(--muted)"></span>Mediana escolas municipais</span>`:'')+
    `<span class="it"><span class="sw dash"></span>Meta INEP (até 2021)</span></div>`);
  return b;
}
function fDecomp(e){
  const b=sub('O que moveu o IDEB — aprendizagem × fluxo');
  if(!e.decomp.length){ b.insertAdjacentHTML('beforeend',
    '<p style="color:var(--muted);font-size:13px;margin:0">Sem transições com dados.</p>'); return b; }
  b.appendChild(decompChart(e.decomp.slice().reverse(), false));
  b.insertAdjacentHTML('beforeend',
    `<div class="legend"><span class="it"><span class="sw" style="background:var(--aprend)"></span>Aprendizagem (P̄·ΔN)</span>
     <span class="it"><span class="sw" style="background:var(--fluxo)"></span>Fluxo (N̄·ΔP)</span></div>`);
  return b;
}
function fDisc(e){
  const b=sub('Proficiência SAEB — LP × Matemática');
  if(!e.disc.length){ b.insertAdjacentHTML('beforeend',
    '<p style="color:var(--muted);font-size:13px;margin:0">Sem proficiências divulgadas.</p>'); return b; }
  const W=430,H=200,L=38,R=52,T=10,B=24;
  const anos=e.disc.map(p=>p.ano), vals=e.disc.flatMap(p=>[p.lp,p.mt]).filter(v=>v!=null);
  const a0=Math.min(...anos),a1=Math.max(...anos);
  const ymin=Math.floor(Math.min(...vals)/10)*10, ymax=Math.ceil(Math.max(...vals)/10)*10;
  const x=a=>L+(a-a0)/Math.max(1,a1-a0)*(W-L-R);
  const y=v=>T+(ymax-v)/Math.max(1,ymax-ymin)*(H-T-B);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`},b);
  for(let g=ymin;g<=ymax;g+=10){
    el('line',{x1:L,x2:W-R,y1:y(g),y2:y(g),class:'gline'},svg);
    el('text',{x:L-4,y:y(g)+3.5,'text-anchor':'end',class:'tick'},svg).textContent=g;
  }
  anos.forEach(a=>el('text',{x:x(a),y:H-B+14,'text-anchor':'middle',class:'tick'},svg).textContent=a);
  for (const [k,cv,rot,nome] of [['lp','--mun','LP','Língua Portuguesa'],['mt','--est','MT','Matemática']]){
    const pts=e.disc.filter(p=>p[k]!=null); if(!pts.length) continue;
    el('path',{d:pts.map((p,i)=>(i?'L':'M')+x(p.ano)+' '+y(p[k])).join(''),fill:'none',
      stroke:css(cv),'stroke-width':2},svg);
    pts.forEach(p=>{
      el('circle',{cx:x(p.ano),cy:y(p[k]),r:3,fill:css(cv),stroke:css('--surface'),'stroke-width':1.5},svg);
      const hit=el('circle',{cx:x(p.ano),cy:y(p[k]),r:11,fill:'transparent'},svg);
      hit.addEventListener('mousemove',ev=>showTip(
        `<div class="t">${p.ano}</div><div class="r"><span>${nome}</span><b>${fmt(p[k])}</b></div>`,ev));
      hit.addEventListener('mouseleave',hideTip);
    });
    const u=pts.at(-1);
    el('text',{x:x(u.ano)+7,y:y(u[k])+3.5,class:'tick',style:'font-weight:700;fill:'+css(cv)},svg)
      .textContent=`${rot} · ${Math.round(u[k])}`;
  }
  return b;
}
function fApr(e,cor){
  const b=sub('Aprovação por série — 2025 (%)');
  if(!e.apr.some(p=>p.esc!=null||p.rede!=null)){ b.insertAdjacentHTML('beforeend',
    '<p style="color:var(--muted);font-size:13px;margin:0">Sem taxas de aprovação em 2025.</p>'); return b; }
  const W=430,H=210,L=36,R=10,T=16,B=26,ymin=60,ymax=100;
  const x=i=>L+(i+.5)/e.apr.length*(W-L-R);
  const y=v=>T+(ymax-Math.max(v,ymin))/(ymax-ymin)*(H-T-B);
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`},b);
  for(let g=ymin;g<=ymax;g+=10){
    el('line',{x1:L,x2:W-R,y1:y(g),y2:y(g),class:'gline'},svg);
    el('text',{x:L-4,y:y(g)+3.5,'text-anchor':'end',class:'tick'},svg).textContent=g;
  }
  const bw=Math.min(42,(W-L-R)/e.apr.length*.55);
  e.apr.forEach((p,i)=>{
    el('text',{x:x(i),y:H-B+14,'text-anchor':'middle',class:'tick'},svg).textContent=p.serie.split(' ')[0];
    if(p.esc!=null){
      const bar=el('rect',{x:x(i)-bw/2,y:y(p.esc),width:bw,height:(H-B)-y(p.esc),fill:cor,rx:2},svg);
      el('text',{x:x(i),y:y(p.esc)-5,'text-anchor':'middle',class:'tick',
        style:'font-weight:700;fill:'+css('--ink')},svg).textContent=Math.round(p.esc);
      bar.addEventListener('mousemove',ev=>showTip(
        `<div class="t">${p.serie}</div><div class="r"><span>Escola</span><b>${fmt(p.esc)}%</b></div>`+
        (p.rede!=null?`<div class="r"><span>Rede (referência)</span><b>${fmt(p.rede)}%</b></div>`:''),ev));
      bar.addEventListener('mouseleave',hideTip);
    }
    if(p.rede!=null){
      const cx=x(i),cy=y(p.rede);
      el('path',{d:`M${cx} ${cy-5.5}L${cx+5.5} ${cy}L${cx} ${cy+5.5}L${cx-5.5} ${cy}Z`,
        fill:css('--ink'),stroke:css('--surface'),'stroke-width':1.4},svg);
    }
  });
  b.insertAdjacentHTML('beforeend',
    `<div class="legend"><span class="it"><span class="sw" style="background:${cor}"></span>Escola</span>
     <span class="it"><span style="color:var(--ink)">◆</span>Rede (referência)</span>
     <span class="it">eixo a partir de 60%</span></div>`);
  return b;
}
function fObs(e){
  const b=sub('Leituras automáticas');
  b.insertAdjacentHTML('beforeend',`<ul class="obs">${e.obs.map(o=>`<li>${o}</li>`).join('')}</ul>`);
  return b;
}

/* ==================================================== navegação e tema ======= */
const PAGINAS = [
  ['Visão geral',        'Principais indicadores da edição 2025', pagina0],
  ['Evolução histórica', 'Séries 2005–2025, posição relativa e decomposição', pagina1],
  ['Ranking de escolas', 'Maiores e menores IDEB por etapa', pagina2],
  ['Fichas por escola',  'Selecione uma escola para ver a ficha completa', pagina3],
];
let paginaAtual = 0;
function irPara(i){
  paginaAtual = i;
  document.querySelectorAll('.page').forEach((s,k)=>s.classList.toggle('on',k===i));
  $('tituloPagina').textContent = PAGINAS[i][0];
  $('dicaPagina').textContent = PAGINAS[i][1];
  renderNav();
  PAGINAS[i][2]();
  history.replaceState(null,'',`#p${i+1}`);
}
function renderNav(){
  const n=$('nav'); n.innerHTML='';
  PAGINAS.forEach(([rot],i)=>{
    const b=document.createElement('button');
    b.className = i===paginaAtual?'on':'';
    b.innerHTML=`<span class="num">${i+1}</span><span>${rot}</span>`;
    b.onclick=()=>irPara(i);
    n.appendChild(b);
  });
}
const TEMAS=[['auto','Auto'],['light','Claro'],['dark','Escuro']];
function aplicarTema(t){
  if(t==='auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=t;
  try{ localStorage.setItem('dash-ideb-tema',t); }catch(err){}
  const box=$('tema'); box.innerHTML='';
  for (const [val,rot] of TEMAS){
    const b=document.createElement('button');
    b.textContent=rot; b.className=val===t?'on':'';
    b.onclick=()=>{ aplicarTema(val); PAGINAS[paginaAtual][2](); };
    box.appendChild(b);
  }
}
let tema='light';
try{ tema=localStorage.getItem('dash-ideb-tema')||'light'; }catch(err){}
aplicarTema(tema);

/* interruptor da rede estadual: refaz a página ativa com o novo recorte */
const sw = $('swEstadual');
try{ incluirEstadual = localStorage.getItem('dash-ideb-estadual') !== 'off'; }catch(err){}
function aplicarEscopo(){
  sw.checked = incluirEstadual;
  $('escopo').hidden = incluirEstadual;
  try{ localStorage.setItem('dash-ideb-estadual', incluirEstadual?'on':'off'); }catch(err){}
}
sw.addEventListener('change', ()=>{
  incluirEstadual = sw.checked;
  aplicarEscopo();
  escolaFi = null;              // a escola em foco pode não existir no novo recorte
  PAGINAS[paginaAtual][2]();
});
aplicarEscopo();
const m=location.hash.match(/^#p([1-4])$/);
irPara(m?+m[1]-1:0);
