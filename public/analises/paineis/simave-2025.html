<style>
@font-face{font-family:'IBM Plex Sans';font-style:normal;font-weight:300 700;

@font-face{font-family:'Playfair Display';font-style:normal;font-weight:400 800;
  font-display:swap;src:url('/fonts/playfair-display-latin.woff2') format('woff2')}
:root{
  /* Paleta do site — ver src/styles/global.css */
  --plane:#F8F6F1; --surface:#FFFFFF; --ink:#1C1917; --ink-2:#57534E; --muted:#78716C;
  --grid:#E9E3DB; --axis:#CFC7BC; --border:#E2DDD6;
  --rail:#1B4F4F; --rail-ink:#F8F6F1; --rail-ink-2:#9FBAB7; --rail-hover:rgba(248,246,241,.10);
  --mun:#1B4F4F; --est:#B4531F; --mg:#8A8179; --reg:#6E5B9B; --sul:#6E8B3D;
  --baixo:#A6402F; --inter:#D9A441; --recom:#4E7C7C; --avanc:#1B4F4F;
  --on-baixo:#FFFFFF; --on-inter:#3D2B08; --on-recom:#FFFFFF; --on-avanc:#FFFFFF;
  --good:#3F6B45; --bad:#A6402F; --accent:#1B4F4F; --on-accent:#F8F6F1;
  --wash:rgba(27,79,79,.07);
  --warn-soft:rgba(217,164,65,.13); --warn-wash:rgba(217,164,65,.20); --warn-ink:#8A5A12;
  --shadow:none;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Playfair Display',Georgia,serif;
  --rail-on:var(--rail-ink); --rail-on-ink:var(--rail);
  color-scheme:light;
}
:root:where(:not([data-theme="light"])){ }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    /* variante escura da mesma paleta, em neutros quentes */
    --plane:#14120F; --surface:#1E1B17; --ink:#F5F2EC; --ink-2:#CFC7BC; --muted:#9A9188;
    --grid:#2E2A25; --axis:#3E3831; --border:#332E28;

    --mun:#6FB0A6; --est:#DB7A45; --mg:#9A9188; --reg:#A395D8; --sul:#9CBF63;
    --baixo:#D9705C; --inter:#E5B85E; --recom:#5E9E96; --avanc:#A8D4CB;
    --on-baixo:#2A1410; --on-inter:#3D2B08; --on-recom:#0E2926; --on-avanc:#0E2926;
    --good:#7DB183; --bad:#D9705C; --accent:#6FB0A6; --on-accent:#11302D;
    --wash:rgba(111,176,166,.14);
    --warn-soft:rgba(229,184,94,.10); --warn-wash:rgba(229,184,94,.16); --warn-ink:#E5B85E;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  /* variante escura da mesma paleta, em neutros quentes */
  --plane:#14120F; --surface:#1E1B17; --ink:#F5F2EC; --ink-2:#CFC7BC; --muted:#9A9188;
  --grid:#2E2A25; --axis:#3E3831; --border:#332E28;

}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font:14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 0 16px;display:flex;
  flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 18px}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--rail-ink-2)}
.brand h1{font-family:var(--font-display);font-size:20px;line-height:1.2;
  margin:7px 0 6px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--rail-ink-2)}
.nav{display:flex;flex-direction:column;gap:1px;padding:0 10px}
.nav button{all:unset;padding:9px 12px;border-radius:4px;cursor:pointer;font-size:13px;
  color:var(--rail-ink-2);display:flex;gap:9px;align-items:center}
.nav button:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav button[aria-current="true"]{background:var(--rail-on);color:var(--rail-on-ink);font-weight:600}
.nav .num{font-variant-numeric:tabular-nums;opacity:.6;font-size:11px;min-width:12px}
.foot{margin-top:auto;padding:16px 20px 0;font-size:11px;color:var(--rail-ink-2);line-height:1.55}
.stage{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:16px 26px;border-bottom:1px solid var(--border);
  background:var(--plane);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:700;
  letter-spacing:-.01em}
.hint{font-size:12px;color:var(--muted);flex:1;min-width:120px}
.ctrl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.ctrl[hidden]{display:none}
select{font:inherit;font-size:12.5px;padding:5px 8px;border-radius:4px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink)}
.seg{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;
  background:var(--surface)}
.seg button{all:unset;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pages{padding:22px 26px 60px}
.page{display:none}.page.on{display:block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;
  padding:16px 18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:13.5px;font-weight:640}
.card .cap{font-size:11.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.kpi .lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .big{font-size:30px;font-weight:660;font-variant-numeric:tabular-nums;line-height:1.15;margin:5px 0 2px}
.kpi .sub{font-size:12px;color:var(--ink-2)}
.up{color:var(--good)}.dn{color:var(--bad)}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;
  background:var(--wash);color:var(--accent)}
.chip.warn{background:var(--warn-wash);color:var(--warn-ink)}
.note{background:var(--warn-soft);border-left:3px solid var(--inter);padding:10px 13px;
  border-radius:0 4px 4px 0;font-size:12.5px;color:var(--ink-2);margin:0 0 14px;line-height:1.55}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--border);
  font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
td.l,th.l{text-align:left;white-space:normal;font-variant-numeric:normal}
tbody tr:hover{background:var(--wash)}
.scroll{overflow-x:auto}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin:0 0 8px}
.lg i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:-1px}
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:10px;fill:var(--muted)}
.gl{stroke:var(--grid);stroke-width:1}
.empty{color:var(--muted);font-size:12.5px;padding:18px 0;text-align:center}
@media(max-width:820px){body{grid-template-columns:1fr}.rail{position:static;height:auto}}

/** ranking em pontos ancorados na mediana: itens=[{nome,v,rede}] */
function barrasH(itens,{ref=null,unid=""}={}){
  if(!itens.length) return el("div",{cls:"empty"},"Sem escolas com resultado divulgado.");
  const rowH=21, H=itens.length*rowH, W=380, pad={l:262,r:56,t:16,b:8};
  const vs=itens.map(i=>i.v);
  let v0=Math.min(...vs), v1=Math.max(...vs); const m=(v1-v0)*.08||2; v0-=m; v1+=m;
  const X=v=>(v-v0)/(v1-v0)*W; const kids=[];
  const base=ref!=null?ref:vs.reduce((a,b)=>a+b,0)/vs.length;
  // faixa de referência + eixo de valores
  kids.push(ns("line",{x1:X(base),x2:X(base),y1:-6,y2:H,stroke:"var(--axis)","stroke-width":1.2}));
  kids.push(ns("text",{x:X(base),y:-9,class:"ax","text-anchor":"middle"},
    "mediana "+fnum(base)));
  itens.forEach((it,i)=>{
    const y=i*rowH+rowH/2, cor=it.rede==="Municipal"?"var(--mun)":"var(--est)";
    kids.push(ns("line",{x1:X(base),x2:X(it.v),y1:y,y2:y,stroke:cor,"stroke-width":2,
      opacity:.45,"stroke-linecap":"round"}));
    kids.push(ns("circle",{cx:X(it.v),cy:y,r:4.2,fill:cor,stroke:"var(--surface)","stroke-width":1.2}));
    kids.push(ns("text",{x:-8,y:y+3.5,class:"ax","text-anchor":"end"},
      it.nome.length>32?it.nome.slice(0,31)+"\u2026":it.nome));
    const dir=it.v>=base?1:-1;
    kids.push(ns("text",{x:X(it.v)+dir*9,y:y+3.5,class:"ax","font-weight":"600",
      "text-anchor":dir>0?"start":"end"},fnum(it.v)+unid));
  });
  const wrap=el("div",{cls:"scroll"}); wrap.append(svg(W,H,pad,kids)); return wrap;
}
/** dispersão z0 x z1 com quadrantes */
function dispersao(pontos,{rot0="",rot1=""}={}){
  if(!pontos.length) return el("div",{cls:"empty"},"Sem escolas em ambas as etapas.");
  const W=330,H=280,pad={l:46,r:14,t:14,b:38};
  const lim=Math.max(2.2,...pontos.flatMap(p=>[Math.abs(p.z0),Math.abs(p.z1)]))*1.08;
  const X=v=>(v+lim)/(2*lim)*W, Y=v=>H-(v+lim)/(2*lim)*H;
  const kids=[];
  [-2,-1,0,1,2].forEach(v=>{ if(Math.abs(v)>lim)return;
    kids.push(ns("line",{x1:X(v),x2:X(v),y1:0,y2:H,class:"gl"}));
    kids.push(ns("line",{x1:0,x2:W,y1:Y(v),y2:Y(v),class:"gl"}));
    kids.push(ns("text",{x:X(v),y:H+15,class:"ax","text-anchor":"middle"},v));
    kids.push(ns("text",{x:-7,y:Y(v)+3.5,class:"ax","text-anchor":"end"},v));
  });
  kids.push(ns("line",{x1:X(-lim),x2:X(lim),y1:Y(-lim),y2:Y(lim),
    stroke:"var(--axis)","stroke-width":1,"stroke-dasharray":"4 3"}));
  pontos.forEach(p=>{
    const cor=p.rede==="Municipal"?"var(--mun)":"var(--est)";
    kids.push(ns("circle",{cx:X(p.z0),cy:Y(p.z1),r:5,fill:cor,opacity:.85,
      stroke:"var(--surface)","stroke-width":1.2}));
    const t=ns("title",{}); t.textContent=`${p.nome}: ${p.z0} → ${p.z1}`; 
    kids[kids.length-1].append(t);
  });
  kids.push(ns("text",{x:W/2,y:H+32,class:"ax","text-anchor":"middle"},rot0));
  kids.push(ns("text",{x:-34,y:H/2,class:"ax","text-anchor":"middle",
    transform:`rotate(-90 -34 ${H/2})`},rot1));
  const wrap=el("div",{cls:"scroll"}); wrap.append(svg(W,H,pad,kids)); return wrap;
}

    if(a) l1.append(el("span",{},` · `),

      el("span",{cls:"chip warn"},`sem edição desde ${u.ano}`)));

   }));

     "text-transform:uppercase;color:var(--muted)"},
     bloco+(D.escala[ets[0]]==="alfabetizacao"?" — escala própria, não comparável às demais etapas":"")));

  /* destaques automáticos */

  // as escalas de alfabetização e das demais etapas são diferentes, então os
  // destaques comparam PERCENTIL em MG, que é invariante à escala
  const itens=[];

    const sp=serie(et,di,"pocos"), sm=serie(et,di,"mg"), u=ultimo(sp); if(!u)return;
    const mgv=(sm.find(x=>x.ano===u.ano)||{}).prof;
    const bm=(D.benchmark[et+"|"+di]||[]).find(x=>x.ano===u.ano);
    if(bm==null)return;
    itens.push({et,di,ano:u.ano,pct:bm.pct,pos:bm.pos,n:bm.n,
      gap:mgv!=null?u.prof-mgv:null,adeq:u.adeq});

  return wrap;
}

      tr.append(el("td",{cls:"l"},String(s.ano)),el("td",{cls:"l"},s.etapa),
        el("td",{cls:"l"},D.motivos[s.motivo]||s.motivo),
        el("td",{},fnum(s.efet,0)),el("td",{},fnum(s.part)+"%"));
      b2.append(tr);
    });
    t2.append(b2); c.append(el("div",{cls:"scroll"},t2));
  }
  wrap.append(c);
  return wrap;
}

/* ------------------------------------------------------------- página 5 */
function pagPart(){
  const wrap=el("div");
  wrap.append(el("div",{cls:"note",html:
    "As regras de supressão são mecânicas e foram conferidas contra os dados: "+
    "<b>NP</b> aparece sempre que a escola teve <b>menos de 10 participantes</b>; "+
    "<b>BP</b>, sempre que a participação ficou <b>abaixo de 80%</b>. "+
    "Uma escola sem resultado não é uma escola sem desempenho — é uma escola sem "+
    "amostra suficiente para divulgação."}));

  const g=el("div",{cls:"grid g2"});
  ["Municipal","Estadual"].forEach(rede=>{
    const c=el("div",{cls:"card"});
    c.append(el("h3",{},`Taxa de participação — rede ${rede.toLowerCase()}`),
      el("p",{cls:"cap"},"Percentual dos estudantes previstos que efetivamente fizeram a prova."));
    const etapas=D.etapas.filter(e=>D.participacao.some(p=>p.rede===rede&&p.etapa===e));
    const lg=el("div",{cls:"lg"});
    const dados=etapas.map(et=>{
      const k="et"+D.etapas.indexOf(et);
      CORES[k]=["var(--mun)","var(--est)","var(--sul)","var(--reg)","var(--inter)"]
        [D.etapas.indexOf(et)%5];
      lg.append(el("span",{},el("i",{style:`background:${CORES[k]}`}),et));
      return {rec:k,pts:D.participacao.filter(p=>p.rede===rede&&p.etapa===et)
        .map(p=>({ano:p.ano,v:p.part})).sort((a,b)=>a.ano-b.ano)};
    });
    c.append(lg,linhas(dados,{unid:"%",dom:[0,100]}));
    g.append(c);
  });
  wrap.append(g);

  const c=el("div",{cls:"card",style:"margin-top:14px"});
  c.append(el("h3",{},"Cobertura por edição"),
    el("p",{cls:"cap"},"Quantas escolas de Poços foram avaliadas, quantas tiveram "+
      "resultado divulgado e por que as demais não tiveram."));
  const tb=el("table"),th=el("tr");
  ["Edição","Etapa","Rede","Escolas","Com resultado","NP","BP","NP/BP","Participação"]
    .forEach((h,i)=>th.append(el("th",{cls:i<3?"l":""},h)));
  tb.append(el("thead",{},th));
  const tbody=el("tbody");
  D.participacao.slice().sort((a,b)=>b.ano-a.ano||a.etapa.localeCompare(b.etapa)
    ||a.rede.localeCompare(b.rede)).forEach(p=>{
    const tr=el("tr");
    const falta=p.escolas-p.divulgadas;
    tr.append(el("td",{cls:"l"},String(p.ano)+(D.ressalvas[p.ano]?" ⚠":"")),
      el("td",{cls:"l"},p.etapa),el("td",{cls:"l"},p.rede),
      el("td",{},String(p.escolas)),
      el("td",{cls:falta?"dn":""},`${p.divulgadas} (${fnum(100*p.divulgadas/p.escolas,0)}%)`),
      el("td",{},String(p.NP||"—")),el("td",{},String(p.BP||"—")),
      el("td",{},String(p["NP/BP"]||"—")),el("td",{},fnum(p.part)+"%"));
    tbody.append(tr);
  });
  tb.append(tbody); c.append(el("div",{cls:"scroll"},tb));
  wrap.append(c);
  return wrap;
}

/* ------------------------------------------------------------- página 6 */
function pagPercurso(){
  const wrap=el("div"), di=S.disc;
  const ps=D.percurso.filter(p=>p.disc===di);
  if(!ps.length) return el("div",{cls:"empty"},"Sem etapas suficientes para comparar.");
  wrap.append(el("div",{cls:"note",html:
    "Cada ponto é uma escola. O eixo mostra a <b>posição relativa dentro de Poços</b> "+
    "(desvios-padrão acima ou abaixo da média do município), não a proficiência bruta — "+
    "é assim que etapas de escalas diferentes ficam comparáveis. "+
    "Pontos acima da diagonal são escolas que <b>ganham</b> posição na etapa seguinte; "+
    "abaixo, escolas que <b>perdem</b>.<br>"+
    "<b>Limite:</b> são coortes diferentes no mesmo ano, não os mesmos alunos "+
    "acompanhados ao longo do tempo, e o número de escolas é pequeno — leia como "+
    "descrição do perfil das unidades, não como efeito causal da escola."}));

  const g=el("div",{cls:"grid g2"});
  ps.forEach(p=>{
    const c=el("div",{cls:"card"});
    c.append(el("h3",{},`${p.e0} → ${p.e1}`),
      el("p",{cls:"cap"},`${D.disciplinas[di]}, edição ${p.ano}. `+
        `${p.n} escolas avaliadas nas duas etapas. `+
        `Correlação entre as posições: r = ${fnum(p.r,2)}.`));
    c.append(dispersao(p.pontos,{rot0:"posição no "+p.e0,rot1:"posição no "+p.e1}));
    const forte=Math.abs(p.r)>=.7;
    c.append(el("p",{cls:"cap",style:"margin-top:10px"},
      forte?`Posições fortemente alinhadas: quem está bem no ${p.e0} tende a estar bem no ${p.e1}.`
           :`Posições praticamente desalinhadas: o desempenho no ${p.e0} não antecipa o do ${p.e1}.`));
    g.append(c);
  });
  wrap.append(g);

  const alvo=ps.find(p=>p.e0==="2º EF"&&p.e1==="5º EF")||ps[0];
  const c=el("div",{cls:"card",style:"margin-top:14px"});
  c.append(el("h3",{},`Quem mais perde e mais ganha posição — ${alvo.e0} → ${alvo.e1}`),
    el("p",{cls:"cap"},"Diferença entre a posição relativa nas duas etapas, em "+
      "desvios-padrão. Valores negativos indicam escola que se destaca na etapa "+
      "inicial e recua na seguinte."));
  const tb=el("table"),th=el("tr");
  ["Escola","Rede",`Posição ${alvo.e0}`,`Posição ${alvo.e1}`,"Variação"]
    .forEach((h,i)=>th.append(el("th",{cls:i<2?"l":""},h)));
  tb.append(el("thead",{},th));
  const tbody=el("tbody");
  alvo.pontos.forEach(p=>{
    const tr=el("tr",{style:"cursor:pointer"});
    tr.onclick=()=>{S.escola=p.cd;S.pag=4;render();window.scrollTo(0,0);};
    tr.append(el("td",{cls:"l"},p.nome),el("td",{cls:"l"},p.rede),
      el("td",{},fsig(p.z0,2)),el("td",{},fsig(p.z1,2)),
      el("td",{cls:cls(p.d)},fsig(p.d,2)));
    tbody.append(tr);
  });
  tb.append(tbody); c.append(el("div",{cls:"scroll"},tb)); wrap.append(c);
  return wrap;
}

/* ------------------------------------------------------------------ chassis */
const PAGS=[
  ["Visão geral","Onde Poços está na edição mais recente de cada etapa",pagVisao,[]],
  ["Evolução histórica","Séries 2015–2025 e posição relativa entre municípios",pagHist,["etapa","disc"]],
  ["Padrões de desempenho","Composição Baixo → Avançado e sua evolução",pagPadroes,["etapa","disc"]],
  ["Ranking e equidade","Distância entre a melhor e a pior escola da rede",pagRanking,["etapa","disc"]],
  ["Ficha por unidade","Retrato completo de uma escola",pagFicha,[]],
  ["Participação","Quem ficou sem resultado divulgado e por quê",pagPart,[]],
  ["Percurso entre etapas","A escola que alfabetiza bem é a que chega forte ao 5º ano?",
   pagPercurso,["disc"]],
];
function render(){
  const [tit,dica,fn,ctl]=PAGS[S.pag];
  $("#tit").textContent=tit; $("#dica").textContent=dica;
  $("#ctlEtapa").hidden=!ctl.includes("etapa");
  $("#ctlDisc").hidden=!ctl.includes("disc");
  [...$("#nav").children].forEach((b,i)=>b.setAttribute("aria-current",i===S.pag));
  const se=$("#selEtapa"), sd=$("#selDisc");        // mantém os seletores em sincronia
  if(se&&se.value!==S.etapa) se.value=S.etapa;
  if(sd&&sd.value!==S.disc) sd.value=S.disc;
  const p=$("#pages"); p.innerHTML=""; p.append(fn());
}
function montarControles(){
  const et=el("select",{id:"selEtapa"});
  D.etapas.forEach(e=>{ if(D.series[e+"|LP"]) et.append(el("option",{value:e},e)); });
  et.value=S.etapa; et.onchange=()=>{S.etapa=et.value;render();};
  $("#ctlEtapa").append(el("label",{},"Etapa"),et);
  const di=el("select",{id:"selDisc"});
  Object.entries(D.disciplinas).forEach(([k,v])=>di.append(el("option",{value:k},v)));
  di.value=S.disc; di.onchange=()=>{S.disc=di.value;render();};
  $("#ctlDisc").append(el("label",{},"Componente"),di);
  const nav=$("#nav");
  PAGS.forEach(([t],i)=>{ const b=el("button",{},el("span",{cls:"num"},String(i)),t);
    b.onclick=()=>{S.pag=i;render();window.scrollTo(0,0);}; nav.append(b); });
  const tm=$("#tema");
  [["auto","Auto"],["light","Claro"],["dark","Escuro"]].forEach(([k,r])=>{
    const b=el("button",{},r); b.onclick=()=>{ if(k==="auto")document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme",k);
      [...tm.children].forEach(c=>c.setAttribute("aria-pressed",c===b)); };
    b.setAttribute("aria-pressed",String(k==="light"));
    tm.append(b); });
}
montarControles(); render();
</script></body></html>
